name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-skip-ci-trigger:
    name: "Detect CI Trigger: [skip-ci]"
    if: >
      github.repository == 'jean2262/grdtiler' &&
      (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: xarray-contrib/ci-trigger@v1
        id: detect-trigger
        with:
          keyword: "[skip-ci]"

  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: detect-skip-ci-trigger

    if: needs.detect-skip-ci-trigger.outputs.triggered == 'false'

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: default
          locked: true
          cache: true

      - name: Verify import
        run: pixi run python -c "import grdtiler"

      - name: Run tests
        run: pixi run cov

  build:
    name: rattler-build
    runs-on: ubuntu-latest
    needs: detect-skip-ci-trigger

    if: needs.detect-skip-ci-trigger.outputs.triggered == 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: build
          locked: true
          cache: true

      - name: Build conda package
        run: pixi run -e build build
