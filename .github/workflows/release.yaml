name: Release
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: build
          locked: true
          cache: true

      - name: Build package
        run: |
          export GRDTILER_VERSION=${GITHUB_REF_NAME#v}
          pixi run -e build build

      - name: Upload to Anaconda
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          pixi run -e build rattler-build upload anaconda \
            --owner Oceanscope \
            --api-key "$ANACONDA_API_KEY" \
            output/noarch/*.conda
